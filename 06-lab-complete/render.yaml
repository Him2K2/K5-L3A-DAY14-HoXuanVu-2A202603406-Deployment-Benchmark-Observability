# ============================================================
# Cấu hình deploy Render — Blueprint (tiêu chí 12, có thể dùng thay railway.toml)
#   secret dùng generateValue / sync:false, KHÔNG ghi thẳng giá trị.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "10"
      # Secret: Render tự sinh, không ghi giá trị vào file.
      - key: AGENT_API_KEY
        generateValue: true
      # Redis: lấy connection string từ service redis bên dưới.
      - key: REDIS_URL
        fromService:
          type: redis
          name: day14-redis
          property: connectionString

  - type: redis
    name: day14-redis
    plan: free
    ipAllowList: []
