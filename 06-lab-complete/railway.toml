# ============================================================
# Cấu hình deploy Railway (tiêu chí 12)
#   App lắng nghe theo biến PORT do Railway cấp (đã xử lý trong CMD của Dockerfile).
#   Đặt AGENT_API_KEY, REDIS_URL bằng biến môi trường trên Railway, KHÔNG ghi vào file.
# ============================================================
[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
