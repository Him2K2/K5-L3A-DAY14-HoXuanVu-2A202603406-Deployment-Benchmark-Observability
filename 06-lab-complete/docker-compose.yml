# ============================================================
# Agent + Redis chạy bằng một lệnh `docker compose up` (tiêu chí 2)
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=${AGENT_API_KEY:-dev-key}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - DAILY_BUDGET_USD=${DAILY_BUDGET_USD:-10}
      - MONTHLY_BUDGET_USD=${MONTHLY_BUDGET_USD:-0}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
