# Exercise 7.3 (bài 4) — Quality gate: chặn merge khi eval regression / accuracy thấp.
# run_eval.py trả exit code 1 nếu accuracy < --min-accuracy hoặc có regression so với baseline
# → step fail → pull request không merge được.
name: eval-quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/develop/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Start agent v2
        run: |
          AGENT_VERSION=v2 PORT=8002 python app.py &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8002/health && break
            sleep 1
          done

      - name: Quality gate (accuracy >= 90%, no regression vs baseline)
        run: |
          python eval/run_eval.py \
            --url http://localhost:8002 \
            --min-accuracy 0.9 \
            --baseline reports/eval_v2.json
          # exit code != 0  ->  step fail  ->  chặn merge
